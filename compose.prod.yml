services:
  wsp-api:
  #No para PROD, build + compose up por separado
    # build: #Solo se ejecuta con docker compose ... --build
    #   context: .
    #   dockerfile: Dockerfile.prod
    image: yordii/micro-wsp-api:${IMAGE_TAG}
    container_name: wsp_api_prod
    restart: unless-stopped #Para resiliencia


    # Solo para Docker swarm
    # deploy:
    #   restart_policy:
    #     condition: on-failure
    #     delay: 5s
    #     max-attempts: 3
    #     window: 120s
    env_file:
      - .env.production
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/api"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - lotiza-prod

  mysql:
    image: mysql:8.0 
    container_name: wsp_mysql_prod
    restart: unless-stopped
    
    #Solo .env para interpolacion de variables, por eso se pasa por cli el .env.production, --env-file es solo para interpolar vars, no para inyectar en container
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
 
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d #Solo si el volumne no existe, para inicializar la DB 

    # Para que no se coma memoria y no se active OOM KILLER de Linux
    deploy:
      resources:
        limits:
          memory: 768M

        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - lotiza-prod

  # PostgreSQL exclusivo para Evolution
  postgres:
    image: postgres:16-alpine
    container_name: wsp_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: ${DB_EVOLUTION_DATABASE}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - lotiza-prod

  # ─── Redis (caché de sesiones para Evolution) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: wsp_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - lotiza-prod
 
  # ─── Evolution API ─────────────────────────────────────────────────
  evolution:
  
    image: evoapicloud/evolution-api:latest
    container_name: wsp_evolution_prod
    restart: unless-stopped

    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
 
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      WA_VERSION_FETCH_ON_STARTUP: 'true'
       # Override manual de versión conocida que funciona actualmente
      WA_VERSION: '2.3000.1023179494'

      # Usa el mismo MySQL que tu app, mismas credenciales
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/${DB_EVOLUTION_DATABASE}
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
 
      # Redis para que las sesiones sobrevivan reinicios
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_TTL: '604800'   # 7 días
 
      # Webhook por instancia hacia tu NestJS
      WEBHOOK_GLOBAL_ENABLED: 'false'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'true'
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'false'
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - lotiza-prod
 
volumes:
  mysql_data_prod:
  postgres_data_prod:
  redis_data:
 
networks:
  lotiza-prod:
    driver: bridge